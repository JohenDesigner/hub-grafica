<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8650A">
<meta name="robots" content="noindex, nofollow">
<title>Hub Johen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Outfit:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topo">
  <a href="#inicio" class="topo-marca" aria-label="Início"><img src="img/logo-icone.webp" alt="" width="32" height="32"></a>
  <h1 id="titulo">Hub Johen</h1>
  <span id="estado-rede" class="estado-rede" hidden>offline</span>
</header>

<div id="pendentes" class="faixa-pendentes" hidden role="status"></div>

<main id="tela" class="tela" tabindex="-1"></main>

<nav id="nav" class="nav" aria-label="Navegação">
  <a href="#inicio" data-rota="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
  <a href="#orcamento" data-rota="orcamento"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg><span>Orçamento</span></a>
  <a href="#pedidos" data-rota="pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4 7.5 12 11l8-3.5M12 11v9"/></svg><span>Pedidos</span></a>
  <a href="#clientes" data-rota="clientes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Clientes</span></a>
  <a href="#mais" data-rota="mais"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg><span>Mais</span></a>
</nav>

<section id="login" class="login" hidden>
  <form id="form-login" class="login-caixa" autocomplete="on">
    <img src="img/logo-wordmark.webp" alt="Johen Artes Gráficas" class="login-logo">
    <h2>Hub da Gráfica</h2>
    <label class="campo"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="campo"><span>Senha</span><input type="password" name="senha" autocomplete="current-password" required></label>
    <button class="btn btn-primario" type="submit">Entrar</button>
    <button class="btn" type="button" id="esqueci">Esqueci a senha</button>
    <p class="login-erro" id="login-erro" role="alert"></p>
  </form>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
